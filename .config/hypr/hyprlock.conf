source = ~/.cache/theme/hyprlock.conf

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(232, 205, 193, 1)
    font_size = 162
    font_family = Electroharmonix Bold
    # outline_thickness = 10
    # outline_color = rgba(0,0,0,0.25)
    blur = 0.35
    position = -31.05%, 28.35%
    halign = center
    valign = center
}

# Day
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A %-d")"
    color = rgba(162, 143, 135, 1)
    font_size = 30
    font_family = Electroharmonix Bold
    position = -31.05%, 19.7%
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 320, 55
    color = rgba(255, 255, 255, .1)
    rounding = 2
    border_size = 0
    border_color = rgba(255, 255, 255, 1)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = -31.05%, -140
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =     $USER
    color = rgba(216, 222, 233, 0.80)
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 16
    font_family = Electroharmonix
    position = -31.05%, -140
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 320, 55
    rounding = 5
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    placeholder_text = 
    font_family = Electroharmonix
    hide_input = false
    position = -31.05%, -220
    halign = center
    valign = center
}

